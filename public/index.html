<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikgonavi Hub - IA Sin Restricciones</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin: 0;
            font-size: 24px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #1e3a8a;
            color: #bfdbfe;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        #input-container {
            display: flex;
            gap: 10px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding-top: 10px;
        }
        input {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 0 24px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ikgonavi Hub IA</h1>
        <p style="color: #94a3b8; margin: 5px 0 0 0; font-size: 13px;">Sistema Operativo en Línea</p>
    </header>

    <div id="chat-container">
        <div class="message ai-message">¡Hola! Soy tu IA avanzada conectada a través del servidor. Pregúntame lo que quieras.</div>
    </div>

    <div id="input-container">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí..." autofocus>
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                enviarMensaje();
            }
        });

        async function enviarMensaje() {
            const texto = userInput.value.trim();
            if (!texto) return;

            // Mostrar mensaje del usuario
            agregarMensaje(texto, 'user-message');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Mensaje temporal de carga
            const loadingId = agregarMensaje('Pensando...', 'ai-message');
            
            try {
                const response = await fetch('/api/ia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: texto })
                });

                const data = await response.json();
                
                // Remover mensaje de "Pensando..."
                document.getElementById(loadingId).remove();

                if (data.success) {
                    agregarMensaje(data.respuesta, 'ai-message');
                } else {
                    agregarMensaje('Error: ' + (data.error || 'No se pudo obtener respuesta'), 'ai-message');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                agregarMensaje('Error de conexión con el servidor backend.', 'ai-message');
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function agregarMensaje(texto, clase) {
            const div = document.createElement('div');
            div.className = `message ${clase}`;
            div.id = 'msg-' + Math.random().toString(36.substring(2, 9));
            div.innerText = texto;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.id;
        }
    </script>
</body>
</html>
