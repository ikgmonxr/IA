<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikgonavi Hub - IA Avanzada</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #1e293b;
        }
        h1 {
            color: #38bdf8;
            margin: 0;
            font-size: 22px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 14px;
        }
        .user-message {
            background-color: #1d4ed8;
            color: #eff6ff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        #input-container {
            display: flex;
            gap: 10px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding-top: 10px;
            align-items: center;
        }
        textarea {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 14px;
            resize: none;
            height: 24px;
            outline: none;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        .file-btn {
            background-color: #334155;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            transition: background 0.2s;
        }
        .file-btn:hover {
            background-color: #475569;
        }
        button.send-btn {
            padding: 12px 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.send-btn:hover {
            background-color: #0369a1;
        }
        #file-info {
            font-size: 12px;
            color: #38bdf8;
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ikgonavi Hub - IA Libre</h1>
        <p style="color: #64748b; margin: 3px 0 0 0; font-size: 12px;">Sistema conectado a Llama 3 70B</p>
    </header>

    <div id="chat-container">
        <div class="message ai-message">¡Sistema en línea! Pregúntame lo que necesites, sube fragmentos de código o indícame qué deseas crear.</div>
    </div>

    <div id="file-info"></div>

    <div id="input-container">
        <input type="file" id="fileInput" style="display: none;" onchange="manejarArchivo(event)">
        <button class="file-btn" onclick="document.getElementById('fileInput').click()">📁 Archivo</button>
        <textarea id="userInput" placeholder="Escribe tu mensaje aquí..." rows="1"></textarea>
        <button class="send-btn" onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const fileInfo = document.getElementById('file-info');
        let contenidoArchivo = "";

        function manejarArchivo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                contenidoArchivo = e.target.result;
                fileInfo.innerText = `📎 Archivo cargado: ${file.name}`;
            };
            reader.readAsText(file);
        }

        async function enviarMensaje() {
            let texto = userInput.value.trim();
            if (!texto && !contenidoArchivo) return;

            if (contenidoArchivo) {
                texto += `\n\n[Contenido del archivo adjunto]:\n${contenidoArchivo}`;
                contenidoArchivo = "";
                fileInfo.innerText = "";
            }

            agregarMensaje(userInput.value || "[Archivo adjunto]", 'user-message');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = agregarMensaje('Procesando respuesta...', 'ai-message');
            
            try {
                const response = await fetch('/api/ia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: texto })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.success) {
                    agregarMensaje(data.respuesta, 'ai-message');
                } else {
                    agregarMensaje('⚠️ Error: ' + (data.error || 'Respuesta inválida del servidor'), 'ai-message');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                agregarMensaje('❌ Error crítico de red al intentar conectar con el backend.', 'ai-message');
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function agregarMensaje(texto, clase) {
            const div = document.createElement('div');
            div.className = `message ${clase}`;
            div.id = 'msg-' + Math.random().toString(36).substring(2, 9);
            div.innerText = texto;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.id;
        }
    </script>
</body>
</html>
