<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ikgonavi Hub</title>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; max-width: 800px; margin: 0 auto; width: 100%; }
        .msg { padding: 10px 15px; border-radius: 8px; max-width: 80%; }
        .user { background: #1d4ed8; align-self: flex-end; }
        .ai { background: #1e293b; align-self: flex-start; border: 1px solid #334155; }
        #controls { max-width: 800px; width: 100%; margin: 10px auto; display: flex; gap: 10px; }
        textarea { flex: 1; padding: 10px; background: #1e293b; color: white; border-radius: 8px; border: 1px solid #334155; resize: none; }
        button { padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat"><div class="msg ai">¡Sistema listo! Pregunta lo que sea.</div></div>
    <div id="controls">
        <textarea id="input" placeholder="Escribe tu mensaje..."></textarea>
        <button onclick="enviar()">Enviar</button>
    </div>
    <script>
        async function enviar() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const texto = input.value;
            if(!texto) return;
            
            chat.innerHTML += `<div class="msg user">${texto}</div>`;
            input.value = '';
            
            const res = await fetch('/api/ia', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: texto })
            });
            const data = await res.json();
            chat.innerHTML += `<div class="msg ai">${data.respuesta || data.error}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
